name: 'gradle'
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gradle/**'
      - 'src/**'
      - '*gradle*'
  push:
    branches:
      - main
      - 'releases/*'
    paths:
      - 'gradle/**'
      - 'src/**'
      - '*gradle*'
      - 'plugin/**'
      - 'common/src/**'
      - 'common/build.gradle.kts'

permissions:
  contents: read
  packages: read

jobs:
  gradleValidation:
    name: gradle-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

  gradle-test:
    name: gradle-test
    needs: gradleValidation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        gradleVersion:
          - 7.6
          - 8.5
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 11
          cache: gradle
      - name: Run linters and test
        env:
          GRADLE_VERSION: ${{ matrix.gradleVersion }}
        run: ./gradlew :plugin:test -PtestGradleVersion="$GRADLE_VERSION"
      - name: Collect test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.gradleVersion }}-${{ runner.os }}
          path: ${{ github.workspace }}/build/reports/tests
