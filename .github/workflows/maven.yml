name: 'maven'
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'maven/**'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Qodana.kt'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Checksums.kt'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Version.kt'
  push:
    branches:
      - main
      - 'releases/*'
    paths:
      - 'maven/**'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Qodana.kt'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Checksums.kt'
      - 'plugin/src/main/kotlin/org/jetbrains/qodana/Version.kt'

permissions:
  contents: read
  packages: read

jobs:
  maven-test:
    name: maven-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: zulu
          java-version: 17
          cache: maven

      - name: Build and install plugin
        run: |
          cd maven
          mvn clean install -DskipTests

      - name: Run unit tests
        run: |
          cd maven
          mvn test

      - name: Run integration tests
        run: |
          cd maven
          mvn failsafe:integration-test failsafe:verify

      - name: Collect test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: maven-test-results-${{ runner.os }}
          path: |
            maven/target/surefire-reports
            maven/target/failsafe-reports
