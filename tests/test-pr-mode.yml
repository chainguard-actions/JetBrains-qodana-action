name: Test Qodana scan in pull request mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "true"
          post-pr-comment: "false"
          push-fixes: "none"
          results-dir: "${{ runner.temp }}/qodana/results"
          cache-dir: "${{ runner.temp }}/qodana/caches"
      - name: Assert action ran in PR mode (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in PR mode (outcome=$OUTCOME)"
