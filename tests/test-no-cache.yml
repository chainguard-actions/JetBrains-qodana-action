name: Test with caches disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action with caches disabled
        id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "false"
          cache-default-branch-only: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"
          results-dir: "/tmp/qodana-nocache/results"
          cache-dir: "/tmp/qodana-nocache/caches"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action was skipped or did not run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert results directory was created
        run: |
          echo "Checking results dir: /tmp/qodana-nocache/results"
          if [ ! -d "/tmp/qodana-nocache/results" ]; then
            echo "FAIL: results directory was not created"
            exit 1
          fi
          echo "PASS: results directory exists"

      - name: Assert cache directory was created
        run: |
          echo "Checking cache dir: /tmp/qodana-nocache/caches"
          if [ ! -d "/tmp/qodana-nocache/caches" ]; then
            echo "FAIL: cache directory was not created"
            exit 1
          fi
          echo "PASS: cache directory exists"
