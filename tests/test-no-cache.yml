name: Test with caches disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"
          cache-default-branch-only: "false"
        continue-on-error: true
      - name: Assert action ran without caches (outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was empty"
            exit 1
          fi
          echo "PASS: action ran without caches with outcome=$OUTCOME"
