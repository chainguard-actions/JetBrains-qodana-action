name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action (expected to fail – no license/project)
        id: qodana
        uses: .
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          post-pr-comment: "false"
          pr-mode: "false"
          results-dir: "${{ runner.temp }}/qodana-test/results"
          cache-dir: "${{ runner.temp }}/qodana-test/caches"
        continue-on-error: true

      - name: Assert action was invoked (outcome is failure or success, not skipped)
        env:
          OUTCOME: ${{ steps.qodana.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
