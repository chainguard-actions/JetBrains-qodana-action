name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal results and cache dirs
        run: |
          mkdir -p /tmp/qodana-test/results
          mkdir -p /tmp/qodana-test/caches

      - id: action
        uses: .
        continue-on-error: true
        with:
          results-dir: /tmp/qodana-test/results
          cache-dir: /tmp/qodana-test/caches
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"

      - name: Assert action ran (results dir was created)
        run: |
          echo "Checking that results directory exists (action ran)"
          if [ ! -d "/tmp/qodana-test/results" ]; then
            echo "FAIL: results directory was not created"
            exit 1
          fi
          echo "PASS: results directory exists"

      - name: Assert action outcome is known (success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
