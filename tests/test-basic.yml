name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action (expect failure without license)
        id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          results-dir: "${{ runner.temp }}/qodana-test/results"
          cache-dir: "${{ runner.temp }}/qodana-test/caches"

      - name: Assert action ran (outcome is failure due to no license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either fail (no license) or succeed
          # It must not be 'skipped' or empty — it must have actually run
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action was skipped or did not run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected without license)"

      - name: Assert results directory was created
        run: |
          RESULTS_DIR="${RUNNER_TEMP}/qodana-test/results"
          echo "Checking results dir: $RESULTS_DIR"
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "FAIL: results directory was not created by the action"
            exit 1
          fi
          echo "PASS: results directory exists"

      - name: Assert cache directory was created
        run: |
          CACHE_DIR="${RUNNER_TEMP}/qodana-test/caches"
          echo "Checking cache dir: $CACHE_DIR"
          if [ ! -d "$CACHE_DIR" ]; then
            echo "FAIL: cache directory was not created by the action"
            exit 1
          fi
          echo "PASS: cache directory exists"
