name: Test args input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare directories
        run: |
          mkdir -p /tmp/qodana-args-test/results
          mkdir -p /tmp/qodana-args-test/caches

      - id: action
        uses: .
        continue-on-error: true
        with:
          args: "--log-level debug"
          results-dir: /tmp/qodana-args-test/results
          cache-dir: /tmp/qodana-args-test/caches
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"

      - name: Assert results directory was created (action started)
        run: |
          echo "Checking that results directory was created by the action"
          if [ ! -d "/tmp/qodana-args-test/results" ]; then
            echo "FAIL: results directory was not created"
            exit 1
          fi
          echo "PASS: results directory exists, action ran"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
