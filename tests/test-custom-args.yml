name: Test custom args and artifact name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: "--log-level debug"
          use-caches: "false"
          upload-result: "false"
          artifact-name: "my-qodana-report"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          results-dir: "/tmp/qodana-results-custom"
          cache-dir: "/tmp/qodana-caches-custom"
          push-fixes: "none"
          commit-message: "Apply fixes"
        continue-on-error: true
      - name: Assert action ran with custom args (outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was empty — action did not run"
            exit 1
          fi
          echo "PASS: action ran with custom args, outcome=$OUTCOME"
