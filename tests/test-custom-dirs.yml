name: Test custom results and cache directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          results-dir: /tmp/qodana-custom-results
          cache-dir: /tmp/qodana-custom-caches
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"

      - name: Assert custom results directory was created by action
        run: |
          echo "Checking that custom results directory was created"
          if [ ! -d "/tmp/qodana-custom-results" ]; then
            echo "FAIL: custom results directory /tmp/qodana-custom-results was not created"
            exit 1
          fi
          echo "PASS: custom results directory exists"

      - name: Assert custom cache directory was created by action
        run: |
          echo "Checking that custom cache directory was created"
          if [ ! -d "/tmp/qodana-custom-caches" ]; then
            echo "FAIL: custom cache directory /tmp/qodana-custom-caches was not created"
            exit 1
          fi
          echo "PASS: custom cache directory exists"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
