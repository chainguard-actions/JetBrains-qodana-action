name: Test custom results and cache directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action with custom directories
        id: action
        uses: .
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          post-pr-comment: "false"
          results-dir: "/tmp/custom-qodana-results"
          cache-dir: "/tmp/custom-qodana-caches"
        continue-on-error: true

      - name: Assert custom results directory was created
        run: |
          if [ ! -d "/tmp/custom-qodana-results" ]; then
            echo "FAIL: custom results directory /tmp/custom-qodana-results was not created"
            exit 1
          fi
          echo "PASS: custom results directory exists"

      - name: Assert custom cache directory was created
        run: |
          if [ ! -d "/tmp/custom-qodana-caches" ]; then
            echo "FAIL: custom cache directory /tmp/custom-qodana-caches was not created"
            exit 1
          fi
          echo "PASS: custom cache directory exists"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
