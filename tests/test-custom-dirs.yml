name: Test custom results-dir and cache-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          results-dir: "/tmp/qodana-custom/results"
          cache-dir: "/tmp/qodana-custom/caches"
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          post-pr-comment: "false"
          pr-mode: "false"
          push-fixes: "none"
      - name: Assert action ran and created custom directories
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action creates directories before running qodana, so they should exist
          if [ -d "/tmp/qodana-custom/results" ]; then
            echo "PASS: results directory was created"
          else
            echo "FAIL: results directory was not created"
            exit 1
          fi
          if [ -d "/tmp/qodana-custom/caches" ]; then
            echo "PASS: cache directory was created"
          else
            echo "FAIL: cache directory was not created"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
