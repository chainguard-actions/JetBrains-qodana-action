name: Test Qodana scan with custom directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom directories
        run: |
          mkdir -p /tmp/custom-results
          mkdir -p /tmp/custom-caches
      - id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"
          results-dir: "/tmp/custom-results"
          cache-dir: "/tmp/custom-caches"
      - name: Assert action ran with custom dirs (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom directories (outcome=$OUTCOME)"
