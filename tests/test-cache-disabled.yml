name: Test with caches disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "false"
          cache-default-branch-only: "false"
          upload-result: "false"
          use-annotations: "false"
          post-pr-comment: "false"
          pr-mode: "false"
          push-fixes: "none"
          artifact-name: "qodana-report-cache-test"
      - name: Assert action ran with caches disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with caches disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without Qodana license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
