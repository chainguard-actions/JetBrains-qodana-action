name: Test results and cache directories are created
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action with custom dirs (expected to fail – no license)
        id: qodana
        uses: .
        with:
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          post-pr-comment: "false"
          pr-mode: "false"
          results-dir: "/tmp/qodana-test-dirs/results"
          cache-dir: "/tmp/qodana-test-dirs/caches"
        continue-on-error: true

      - name: Assert results directory was created
        run: |
          echo "Checking /tmp/qodana-test-dirs/results ..."
          if [ ! -d "/tmp/qodana-test-dirs/results" ]; then
            echo "FAIL: results directory was not created"
            exit 1
          fi
          echo "PASS: results directory exists"

      - name: Assert cache directory was created
        run: |
          echo "Checking /tmp/qodana-test-dirs/caches ..."
          if [ ! -d "/tmp/qodana-test-dirs/caches" ]; then
            echo "FAIL: cache directory was not created"
            exit 1
          fi
          echo "PASS: cache directory exists"
