name: Test use-installed-cli option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action with use-installed-cli=true (no qodana on PATH)
        id: action
        uses: .
        continue-on-error: true
        with:
          use-installed-cli: "true"
          use-caches: "false"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"

      - name: Assert action failed gracefully (qodana not on PATH)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (qodana CLI not on PATH)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (qodana CLI was found on PATH)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
