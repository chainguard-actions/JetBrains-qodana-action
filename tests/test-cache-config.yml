name: Test cache configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Qodana action with custom cache keys
        id: action
        uses: .
        continue-on-error: true
        with:
          use-caches: "true"
          primary-cache-key: "qodana-test-primary-key"
          additional-cache-key: "qodana-test-additional-key"
          cache-default-branch-only: "true"
          upload-result: "false"
          use-annotations: "false"
          pr-mode: "false"
          post-pr-comment: "false"
          push-fixes: "none"

      - name: Assert action ran with custom cache configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Qodana config/license)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom cache configuration"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
